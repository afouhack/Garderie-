<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Garderie</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2a37;--mute:#6b7280;--accent:#2f6f5e;--line:#e5e1d8;--danger:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1d2328;--ink:#eef1f4;--mute:#9aa4af;--accent:#5fb89e;--line:#2c353d;--danger:#f97066}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
h1{font-size:22px;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;cursor:pointer;border-top:4px solid var(--c,var(--accent))}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:8px;display:block}
.card b{display:block;margin-top:8px;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.add{width:100%;margin-top:16px;padding:16px;font-size:17px}
.empty{text-align:center;color:var(--mute);padding:40px 12px}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:auto}
.overlay.on{display:flex}
.full{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.full .qrbox{background:#fff;padding:14px;border-radius:20px;width:min(100%,520px)}
.full img{width:100%;display:block}
.full h2{margin:0;font-size:26px}
.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.preview{width:100%;max-height:300px;object-fit:contain;background:#fff;border-radius:12px;margin-top:10px;display:none}
.cropwrap{display:flex;flex-direction:column;align-items:center;gap:14px;flex:1;justify-content:center}
#cCanvas{touch-action:none;border-radius:12px;border:2px solid var(--accent);background:#fff;max-width:100%}
.cropwrap input[type=range]{width:min(100%,360px)}
.hint{font-size:13px;color:var(--mute);text-align:center}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:20px}
</style>
</head>
<body>
<h1>QR Garderie</h1>
<p class="sub">Touchez un enfant pour afficher son QR code en grand.</p>
<div id="list" class="grid"></div>
<div id="empty" class="empty" style="display:none">Aucun QR code pour l'instant.<br>Ajoutez-en un avec le bouton ci-dessous.</div>
<button class="add" id="addBtn">+ Ajouter un enfant</button>
<div class="note" id="note"></div>

<!-- Plein écran -->
<div class="overlay" id="view">
  <div class="full">
    <h2 id="vName"></h2>
    <div class="qrbox"><img id="vImg" alt="QR code"></div>
  </div>
  <div class="row">
    <button class="ghost" id="vEdit">Modifier</button>
    <button id="vClose">Fermer</button>
  </div>
</div>

<!-- Ajout / modification -->
<div class="overlay" id="form">
  <h1 id="fTitle">Ajouter un enfant</h1>
  <label for="fName">Prénom</label>
  <input type="text" id="fName" autocomplete="off" placeholder="ex. Léa">
  <label>Photo du QR code</label>
  <input type="file" id="fFile" accept="image/*" style="display:none">
  <button class="ghost" id="fPick" style="width:100%">Prendre / choisir une photo</button>
  <img class="preview" id="fPrev" alt="">
  <div class="row" style="margin-top:auto;padding-top:20px">
    <button class="ghost" id="fCancel">Annuler</button>
    <button id="fSave">Enregistrer</button>
  </div>
  <button class="danger" id="fDel" style="display:none;margin-top:10px">Supprimer</button>
</div>

<!-- Recadrage -->
<div class="overlay" id="crop" style="z-index:20">
  <h1>Recadrer le QR code</h1>
  <div class="cropwrap">
    <canvas id="cCanvas"></canvas>
    <input type="range" id="cZoom" min="0" max="100" value="0" aria-label="Zoom">
    <div class="hint">Glissez pour déplacer, pincez ou utilisez le curseur pour zoomer.</div>
  </div>
  <div class="row">
    <button class="ghost" id="cCancel">Annuler</button>
    <button id="cOk">Valider</button>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const COLORS=['#2f6f5e','#c2410c','#1d4ed8','#a21caf','#b45309','#0f766e'];
const LS='qr-garderie-v1';
let items=[]; let remote=null; let editing=null; let newImg=null;

function loadLocal(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return []}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){$('note').textContent="Stockage local plein ou indisponible."}}

function render(){
  const l=$('list');l.innerHTML='';
  $('empty').style.display=items.length?'none':'block';
  items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='card';d.style.setProperty('--c',COLORS[i%COLORS.length]);
    const im=document.createElement('img');im.src=it.img;im.alt='';
    const b=document.createElement('b');b.textContent=it.name;
    d.append(im,b);d.onclick=()=>openView(it.id);l.append(d);
  });
}
function find(id){return items.find(x=>x.id===id)}

function openView(id){
  const it=find(id);if(!it)return;
  editing=id;$('vName').textContent=it.name;$('vImg').src=it.img;$('view').classList.add('on');
}
$('vClose').onclick=()=>$('view').classList.remove('on');
$('vEdit').onclick=()=>{$('view').classList.remove('on');openForm(editing)};

function openForm(id){
  editing=id;newImg=null;
  const it=id?find(id):null;
  $('fTitle').textContent=it?'Modifier':'Ajouter un enfant';
  $('fName').value=it?it.name:'';
  $('fPrev').style.display=it?'block':'none';if(it)$('fPrev').src=it.img;
  $('fDel').style.display=it?'block':'none';
  $('fFile').value='';
  $('form').classList.add('on');
}
$('addBtn').onclick=()=>openForm(null);
$('fCancel').onclick=()=>$('form').classList.remove('on');
$('fPick').onclick=()=>$('fFile').click();

// Redimensionne la photo pour rester léger (max 1000 px, JPEG)
function shrink(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=rej;
    r.onload=()=>{
      const img=new Image();
      img.onerror=rej;
      img.onload=()=>{
        const s=Math.min(1,1000/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.85));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
// --- Recadrage : cadre carré, déplacement + zoom ---
const cv=$('cCanvas'),cx=cv.getContext('2d');
let S=320,DPR=2,cimg=null,sc=1,minSc=1,maxSc=1,ox=0,oy=0;
const ptrs=new Map();let pinch0=null;
function clamp(){ // garde l'image au moins en partie dans le cadre
  const w=cimg.width*sc,h=cimg.height*sc;
  ox=Math.min(S*0.9,Math.max(S*0.1-w,ox));oy=Math.min(S*0.9,Math.max(S*0.1-h,oy));
}
function draw(target,k){
  const c=target||cx;const f=k||1;
  c.fillStyle='#fff';c.fillRect(0,0,S*f,S*f);
  c.drawImage(cimg,ox*f,oy*f,cimg.width*sc*f,cimg.height*sc*f);
}
function paint(){cx.setTransform(DPR,0,0,DPR,0,0);draw(cx,1)}
function setScale(ns,px,py){
  ns=Math.min(maxSc,Math.max(minSc,ns));
  const ix=(px-ox)/sc,iy=(py-oy)/sc;sc=ns;ox=px-ix*sc;oy=py-iy*sc;clamp();paint();
  $('cZoom').value=Math.round(100*Math.log(sc/minSc)/Math.log(maxSc/minSc));
}
function openCrop(img){
  cimg=img;S=Math.min(360,window.innerWidth-32);
  cv.width=S*DPR;cv.height=S*DPR;cv.style.width=S+'px';cv.style.height=S+'px';
  minSc=S/Math.max(img.width,img.height);maxSc=minSc*8;sc=minSc;
  ox=(S-img.width*sc)/2;oy=(S-img.height*sc)/2;
  $('cZoom').value=0;$('crop').classList.add('on');paint();
}
$('cZoom').oninput=e=>{setScale(minSc*Math.pow(maxSc/minSc,e.target.value/100),S/2,S/2)};
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();setScale(sc*(e.deltaY<0?1.1:0.9),e.clientX-r.left,e.clientY-r.top)},{passive:false});
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch0=null});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){ox+=e.clientX-p.x;oy+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;clamp();paint()}
  else if(ptrs.size===2){
    p.x=e.clientX;p.y=e.clientY;const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0){const r=cv.getBoundingClientRect();setScale(sc*d/pinch0,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top)}
    pinch0=d;
  }
});
const endP=e=>{ptrs.delete(e.pointerId);pinch0=null};
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
$('cCancel').onclick=()=>{$('crop').classList.remove('on');$('fFile').value=''};
$('cOk').onclick=()=>{
  const out=document.createElement('canvas');out.width=out.height=900;
  const o=out.getContext('2d');o.setTransform(1,0,0,1,0,0);
  const k=900/S;o.fillStyle='#fff';o.fillRect(0,0,900,900);
  o.drawImage(cimg,ox*k,oy*k,cimg.width*sc*k,cimg.height*sc*k);
  newImg=out.toDataURL('image/jpeg',0.88);
  $('fPrev').src=newImg;$('fPrev').style.display='block';
  $('crop').classList.remove('on');
};
$('fFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f);const img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);openCrop(img)};
  img.onerror=()=>{URL.revokeObjectURL(url);alert_('Image illisible, réessayez.')};
  img.src=url;
};
function alert_(m){$('note').textContent=m}

$('fSave').onclick=async()=>{
  const name=$('fName').value.trim();
  const cur=editing?find(editing):null;
  const img=newImg||(cur&&cur.img);
  if(!name||!img){alert_('Indiquez un prénom et ajoutez une photo.');return}
  const it=cur||{id:'q'+Date.now().toString(36)};
  it.name=name;it.img=img;
  if(!cur)items.push(it);
  saveLocal();render();
  $('form').classList.remove('on');
  if(remote){try{await remote.doc(it.id).set({name:it.name,img:it.img})}catch(e){}}
};
$('fDel').onclick=async()=>{
  if(!editing)return;
  if($('fDel').dataset.arm!=='1'){$('fDel').dataset.arm='1';$('fDel').textContent='Confirmer la suppression';return}
  $('fDel').dataset.arm='0';$('fDel').textContent='Supprimer';
  const id=editing;items=items.filter(x=>x.id!==id);saveLocal();render();$('form').classList.remove('on');
  if(remote){try{await remote.doc(id).delete()}catch(e){}}
};

items=loadLocal();render();

// Synchronisation privée (si disponible), sinon stockage local seul
(async()=>{
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();
    remote=db.collection('data/users/'+uid+'/qr');
    const timer=setTimeout(()=>{},10000);
    remote.onSnapshot(snap=>{
      clearTimeout(timer);
      const rows=[];snap.forEach(d=>rows.push(Object.assign({id:d.id},d.data())));
      if(rows.length||!items.length){items=rows;saveLocal();render()}
      else{ // première synchro : on pousse le contenu local
        items.forEach(it=>remote.doc(it.id).set({name:it.name,img:it.img}).catch(()=>{}));
      }
    });
  }catch(e){}
})();
})();
</script>
</body>
</html>
